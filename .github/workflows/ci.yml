name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable, oldstable]
        include:
          # Windows on ARM: float/HFA arguments go through the arm64 thunk.
          - os: windows-11-arm
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        shell: bash
        # Hosted Windows runners lose the print-to-file output of
        # "Microsoft Print to PDF" jobs sent concurrently by separate
        # processes (goprint reports this as ErrOutputMissing). Packages that
        # print therefore run one at a time there.
        run: go test -count=1 -shuffle=on ${{ runner.os == 'Windows' && '-p 1' || '' }} ./...
      - name: Test (386)
        # 32-bit Windows passes 64-bit and struct arguments on the stack;
        # x64 runners execute 386 binaries natively.
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: bash
        env:
          GOARCH: "386"
        run: go test -count=1 -p 1 ./...
      - name: Test (race)
        # The race detector needs cgo and is not available on windows/arm64.
        if: ${{ !(runner.os == 'Windows' && runner.arch == 'ARM64') }}
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: go test -count=1 -race ${{ runner.os == 'Windows' && '-p 1' || '' }} ./...
      - name: Fuzz smoke
        # Native fuzzing is unreliable on Windows runners (spurious
        # "context deadline exceeded"); seed corpora still run there via go test.
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/fuzz.sh 10s

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the badge to the badges branch (main only)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test with coverage
        run: go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Summarize
        id: cov
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          {
            echo "### Coverage: ${pct}%"
            echo '<details><summary>Per function</summary>'
            echo; echo '```'; go tool cover -func=coverage.out; echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.cov.outputs.pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=$(awk -v p="$PCT" 'BEGIN { print (p >= 80) ? "brightgreen" : (p >= 60) ? "yellow" : (p >= 40) ? "orange" : "red" }')
          mkdir -p "$RUNNER_TEMP/badges" && cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > coverage.json
          git add coverage.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Coverage ${PCT}% for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: |
          for goos in linux darwin windows freebsd; do
            echo "::group::GOOS=$goos"; GOOS=$goos go vet ./...; echo "::endgroup::"
          done
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, freebsd, openbsd, netbsd, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - { goos: windows, goarch: "386" }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...
          go test -c -o /dev/null .

  integration-cups:
    name: integration (CUPS, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Set up CUPS with a cups-pdf queue
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cups printer-driver-cups-pdf
          sudo systemctl start cups
          # cups-pdf writes to $HOME/PDF by default; also allow the spool dir.
          mkdir -p "$HOME/PDF"
          for i in $(seq 1 20); do lpstat -p PDF >/dev/null 2>&1 && break; sleep 1; done
          sudo cupsenable PDF && sudo cupsaccept PDF
          lpstat -t
      - name: Test against CUPS
        env:
          GOPRINT_CUPS: "1"
          GOPRINT_CUPS_PDF: ${{ runner.os == 'Linux' && 'PDF' || '' }}
          GOPRINT_CUPS_PDF_OUT: /home/runner/PDF:/var/spool/cups-pdf/runner:/var/spool/cups-pdf/ANONYMOUS
        run: go test -count=1 -v -run 'CUPS' .
      - name: CUPS logs
        if: failure() && runner.os == 'Linux'
        run: sudo tail -n 100 /var/log/cups/error_log /var/log/cups/cups-pdf_log 2>/dev/null || true

  integration-portal:
    name: integration (print portal, D-Bus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install dbus-daemon
        run: sudo apt-get update -q && sudo apt-get install -y -q dbus
      - name: Test against a fake portal on a private bus
        env:
          GOPRINT_PORTAL_TEST: "1"
        run: go test -count=1 -v -run 'Portal' .

  macos-dialog:
    # The print panel itself needs a user; these tests run the dialog's
    # PDFKit print operation without panel as a save-to-PDF job (on the
    # main thread via RunMain) and check the PDFs it writes. They also run
    # in the test matrix; this job shows the details and covers Intel.
    name: macOS dialog (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test print operation
        run: go test -count=1 -v -run 'Mac|OnMain|RunMain|PrintToFile' . ./internal/macprint

  # Single required status check for branch protection.
  ci-ok:
    if: always()
    needs: [test, coverage, lint, cross-compile, integration-cups, integration-portal, macos-dialog]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
