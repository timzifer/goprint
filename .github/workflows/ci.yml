name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test -count=1 -shuffle=on ./...
      - name: Test (race)
        # The race detector needs cgo.
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race ./...
      - name: Fuzz smoke
        shell: bash
        run: bash .github/scripts/fuzz.sh 10s

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the badge to the badges branch (main only)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test with coverage
        run: go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Summarize
        id: cov
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          {
            echo "### Coverage: ${pct}%"
            echo '<details><summary>Per function</summary>'
            echo; echo '```'; go tool cover -func=coverage.out; echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.cov.outputs.pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=$(awk -v p="$PCT" 'BEGIN { print (p >= 80) ? "brightgreen" : (p >= 60) ? "yellow" : (p >= 40) ? "orange" : "red" }')
          mkdir -p "$RUNNER_TEMP/badges" && cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > coverage.json
          git add coverage.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Coverage ${PCT}% for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: |
          for goos in linux darwin windows freebsd; do
            echo "::group::GOOS=$goos"; GOOS=$goos go vet ./...; echo "::endgroup::"
          done
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, freebsd, openbsd, netbsd, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - { goos: windows, goarch: "386" }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...
          go test -c -o /dev/null .

  # Single required status check for branch protection.
  ci-ok:
    if: always()
    needs: [test, coverage, lint, cross-compile]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
