name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration per fuzz target
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Fuzz
        run: bash .github/scripts/fuzz.sh "${{ inputs.fuzztime || '5m' }}"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"
